<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni Tester</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">✓</span>
    <div>
      <h1>Omni Tester</h1>
      <p class="sub">Pick what to check, run it, read the report.</p>
    </div>
  </div>
  <div class="env">
    <label for="env">Environment</label>
    <select id="env"></select>
    <div id="envInfo" class="env-info"></div>
  </div>
</header>

<main class="layout">
  <section class="panel picker" aria-labelledby="pickTitle">
    <div class="panel-head">
      <h2 id="pickTitle">Tests</h2>
      <div class="quick">
        <button type="button" data-preset="all">All</button>
        <button type="button" data-preset="smoke">Smoke</button>
        <button type="button" data-preset="findings" title="Every test that reproduces a QA finding">QA findings</button>
        <button type="button" data-preset="none">None</button>
      </div>
    </div>
    <div id="suites" class="suites"></div>
  </section>

  <section class="panel run" aria-labelledby="runTitle">
    <div class="panel-head">
      <h2 id="runTitle">Run</h2>
      <span id="selCount" class="muted"></span>
    </div>

    <fieldset class="options">
      <legend>Also allow</legend>
      <label><input type="checkbox" id="allowExternal"> External services <small>OpenAI embeddings, website scraping, n8n, fake provider calls</small></label>
      <label><input type="checkbox" id="allowAi"> AI <small>bot replies and benchmark generation; a few cents of OpenAI per test</small></label>
      <label><input type="checkbox" id="allowBilling"> Billing writes <small>plan changes, top-ups, rate cards on test clients; no real money</small></label>
      <label><input type="checkbox" id="allowShared"> Shared-state actions <small>clearing the whole cache, switching a global engine and back; felt by every client</small></label>
      <label><input type="checkbox" id="allowMessaging"> Messaging <small>could reach a real phone; no test uses it</small></label>
      <label><input type="checkbox" id="keepData"> Keep the test clients afterwards <small>the report shows their logins</small></label>
    </fieldset>

    <div class="actions">
      <button type="button" id="runBtn" class="primary">Run selected</button>
      <button type="button" id="stopBtn" class="danger" hidden>Stop</button>
      <button type="button" id="cleanupBtn" class="ghost" title="Deletes [Automation] clients left behind by crashed runs">Delete leftover test clients</button>
    </div>
    <div id="notice" class="notice" hidden></div>

    <div id="current" class="current" hidden>
      <div class="summary">
        <span id="phase" class="phase"></span>
        <span class="pill passed" id="cPassed">0 passed</span>
        <span class="pill failed" id="cFailed">0 failed</span>
        <span class="pill skipped" id="cSkipped">0 skipped</span>
        <a id="reportLink" href="#" target="_blank" hidden>Open report</a>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <ol id="results" class="results"></ol>
      <details id="runLogBox"><summary>Run log</summary><pre id="runLog"></pre></details>
    </div>

    <h3>Recent runs</h3>
    <ul id="history" class="history"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
